name: AI IDEA validation
on:
  push:
    branches: [main, "develop/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Check Python syntax
        run: python -m compileall -q core tests
      - name: Test Python pipeline
        run: python -m unittest discover -s tests -v
      - name: Check Ruby syntax
        run: ruby -c sketchup/ai_idea_scene_importer.rb
      - name: Check Ruby scene parsing
        run: ruby tests/test_scene_parser.rb
