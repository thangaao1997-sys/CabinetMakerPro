name: AI IDEA validation
on:
  push:
    branches: [main, "develop/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Check Python syntax
        run: python -m compileall -q core tests
      - name: Test Python pipeline
        run: python -m unittest discover -s tests -v
      - name: Check packaged Ruby syntax
        run: |
          ruby -c plugin/ai_idea_v10.rb
          ruby -c plugin/ai_idea_v10/main.rb
          ruby -c plugin/ai_idea_v10/scene_importer.rb
          ruby -c sketchup/ai_idea_scene_importer.rb
      - name: Check Ruby scene parsing
        run: ruby tests/test_scene_parser.rb
      - name: Simulated SketchUp import
        run: ruby tests/test_importer_mock.rb
      - name: Build reproducible SketchUp extension
        run: python -m tools.build_rbz --output dist/AI_IDEA_V1_ALPHA.rbz
      - name: Upload RBZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_IDEA_V1_ALPHA_RBZ
          path: dist/AI_IDEA_V1_ALPHA.rbz
          if-no-files-found: error
